# Optional Hostinger VPS / reverse-proxy snippet.
# Place in the site's nginx server{} (or include from conf.d) IN FRONT of Node/Express.
# Reload nginx after install: sudo nginx -t && sudo systemctl reload nginx
#
# This is required when HTML 413 persists despite Express/Multer allowing 60 MB —
# the edge proxy rejects the body before it reaches Node.

client_max_body_size 60m;
client_body_timeout 300s;

location /api/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

location /uploads/ {
  proxy_pass http://127.0.0.1:3001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
