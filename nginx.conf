server {
  listen 80;
  server_name _;

  # Allow CMS PDF uploads up to 60 MB (default nginx is 1m → HTML 413).
  client_max_body_size 60m;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.svg {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Never SPA-fallback API (or uploads) to index.html — that yields HTML where JSON is expected.
  location /api/ {
    return 404;
  }

  location /uploads/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
