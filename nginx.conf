server {
  listen 80;
  server_name _;

  # Allow large CMS uploads when this nginx sits in front of a proxy to Express.
  client_max_body_size 60m;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.svg {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Static Docker image has no Express. For Hostinger VPS with Node, use
  # server/nginx-hostinger-proxy.conf instead of (or in addition to) this file.
  location /api/ {
    return 404;
  }

  location /uploads/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
