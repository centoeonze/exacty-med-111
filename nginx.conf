server {
  listen 80;
  server_name _;

  # LEGACY static-only image — DO NOT use for CMS with uploads.
  # EasyPanel production uses the Node Dockerfile (Express serves dist/ + /api/*).
  # Keeping this file only for reference / optional static demos.

  client_max_body_size 60m;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /favicon.svg {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # Previously returned 404 for /api — that broke uploads when this image was deployed.
  # If you still use nginx in front of Express, proxy instead of returning 404:
  # location /api/ { proxy_pass http://app:3000; ... }
  location /api/ {
    return 404;
  }

  location /uploads/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
